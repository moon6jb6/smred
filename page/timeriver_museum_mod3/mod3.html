<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间博物馆 — 历史的温度</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1515 50%, #1a0a0a 100%);
            color: #f5f5f5;
            font-family: 'Microsoft YaHei', 'SimHei', serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 导航 */
        .nav-buttons {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
            color: rgba(255, 215, 0, 0.8);
        }

        /* 页面标题 */
        .page-header {
            text-align: center;
            padding: 80px 20px 30px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            color: #ffd700;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 1rem;
            letter-spacing: 2px;
        }

        /* 收集进度 */
        .collect-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.15);
            padding: 8px 14px;
            border-radius: 20px;
            color: rgba(255, 215, 0, 0.7);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 物件容器 */
        .objects-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 70vh;
            margin: 20px auto;
            min-height: 500px;
        }

        /* 单个物件 */
        .history-object {
            position: absolute;
            width: 120px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .history-object:hover {
            transform: scale(1.15) translateY(-8px);
        }

        .object-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.2);
            transition: all 0.4s;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* CSS 文物剪影形状 */
        .object-icon .artifact-shape {
            position: absolute;
            width: 50px;
            height: 50px;
            opacity: 0.6;
            transition: opacity 0.4s;
        }

        .history-object:hover .artifact-shape,
        .history-object.explored .artifact-shape {
            opacity: 0.9;
        }

        /* 卷轴 */
        .shape-scroll {
            background: linear-gradient(135deg, rgba(255,215,0,0.6), rgba(200,150,50,0.4));
            clip-path: polygon(10% 0%, 90% 0%, 95% 5%, 95% 95%, 90% 100%, 10% 100%, 5% 95%, 5% 5%);
        }

        /* 旗帜 */
        .shape-flag {
            background: linear-gradient(135deg, rgba(200,50,50,0.6), rgba(139,0,0,0.4));
            clip-path: polygon(15% 0%, 15% 100%, 20% 100%, 20% 10%, 85% 10%, 85% 45%, 20% 45%, 20% 100%, 15% 100%);
        }

        /* 文件/奏折 */
        .shape-paper {
            background: linear-gradient(135deg, rgba(255,255,220,0.5), rgba(200,180,120,0.3));
            clip-path: polygon(0% 0%, 70% 0%, 100% 30%, 100% 100%, 0% 100%);
        }

        /* 枪 */
        .shape-gun {
            background: linear-gradient(135deg, rgba(100,100,100,0.6), rgba(50,50,50,0.4));
            clip-path: polygon(0% 40%, 60% 40%, 60% 20%, 75% 20%, 75% 40%, 100% 40%, 100% 55%, 75% 55%, 75% 80%, 60% 80%, 60% 55%, 0% 55%);
        }

        /* 桌子 */
        .shape-table {
            background: linear-gradient(135deg, rgba(139,90,43,0.6), rgba(100,60,20,0.4));
            clip-path: polygon(5% 30%, 95% 30%, 95% 40%, 80% 40%, 80% 100%, 70% 100%, 70% 40%, 30% 40%, 30% 100%, 20% 100%, 20% 40%, 5% 40%);
        }

        /* 话筒 */
        .shape-mic {
            background: linear-gradient(135deg, rgba(180,180,180,0.5), rgba(100,100,100,0.3));
            clip-path: polygon(35% 0%, 65% 0%, 70% 10%, 70% 45%, 80% 55%, 80% 65%, 70% 65%, 70% 100%, 30% 100%, 30% 65%, 20% 65%, 20% 55%, 30% 45%, 30% 10%);
        }

        /* 剪刀/武器 */
        .shape-weapon {
            background: linear-gradient(135deg, rgba(150,150,150,0.5), rgba(80,80,80,0.3));
            clip-path: polygon(50% 0%, 65% 30%, 100% 50%, 65% 70%, 50% 100%, 35% 70%, 0% 50%, 35% 30%);
        }

        /* 发现光柱效果 */
        .discovery-beam {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .discovery-beam.active {
            opacity: 1;
        }

        .beam-line {
            position: absolute;
            width: 3px;
            height: 0;
            background: linear-gradient(180deg, rgba(255,215,0,0.6), transparent);
            transition: height 1s ease;
            top: 0;
        }

        .discovery-beam.active .beam-line {
            height: 100vh;
        }

        /* 发现粒子 */
        .discovery-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 1.5s ease forwards;
        }

        @keyframes particleFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(0); }
        }

        .history-object:hover .object-icon {
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            background: rgba(255, 215, 0, 0.08);
        }

        /* 3D 悬浮旋转 */
        .object-icon {
            perspective: 300px;
            transform-style: preserve-3d;
        }

        .history-object:hover .object-icon .artifact-shape {
            animation: artifactFloat 2s ease-in-out infinite;
        }

        @keyframes artifactFloat {
            0%, 100% { transform: rotateY(0deg) translateY(0); }
            25% { transform: rotateY(15deg) translateY(-4px); }
            50% { transform: rotateY(0deg) translateY(-8px); }
            75% { transform: rotateY(-15deg) translateY(-4px); }
        }

        /* 出生年高亮 */
        .history-object.birth-highlight .object-icon {
            border-color: rgba(255, 215, 0, 0.9) !important;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4), 0 0 60px rgba(255, 215, 0, 0.15) !important;
            background: rgba(255, 215, 0, 0.15) !important;
        }

        .history-object.birth-highlight .object-label {
            color: #ffd700 !important;
        }

        .history-object.birth-highlight::after {
            content: '你的时代';
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: #ffd700;
            white-space: nowrap;
            letter-spacing: 2px;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* 出生年输入区 */
        .birth-section {
            text-align: center;
            padding: 30px 20px;
            margin-top: 10px;
        }

        .birth-section label {
            color: rgba(255, 215, 0, 0.5);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .birth-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            font-size: 1.2rem;
            padding: 8px 16px;
            border-radius: 8px;
            width: 100px;
            text-align: center;
            margin: 10px;
            font-family: inherit;
        }

        .birth-input:focus {
            outline: none;
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }

        .birth-result {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-top: 8px;
            min-height: 1.5em;
        }

        .history-object.explored .object-icon {
            border-color: rgba(255, 215, 0, 0.5);
            background: rgba(255, 215, 0, 0.1);
        }

        .object-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.4s;
            line-height: 1.4;
        }

        .history-object:hover .object-label {
            color: rgba(255, 215, 0, 0.8);
        }

        .object-year {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 3px;
        }

        /* 浮层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .overlay.active {
            display: flex;
            opacity: 1;
        }

        .overlay-card {
            max-width: 550px;
            width: 90%;
            padding: 40px;
            text-align: center;
            position: relative;
        }

        .overlay-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: rgba(255, 215, 0, 0.08);
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .overlay-title {
            font-size: 1.8rem;
            color: #ffd700;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .overlay-year {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 25px;
        }

        .overlay-story {
            font-size: 1.05rem;
            line-height: 2;
            color: rgba(255, 255, 255, 0.8);
            text-align: left;
            margin-bottom: 30px;
        }

        .overlay-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 10px;
            transition: color 0.3s;
        }

        .overlay-close:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        /* 底部总结 */
        .summary {
            text-align: center;
            padding: 40px 20px 60px;
            max-width: 700px;
            margin: 0 auto;
        }

        .summary-text {
            font-size: 1.15rem;
            line-height: 2;
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
            transition: all 1s;
        }

        .summary-text.unlocked {
            color: rgba(255, 215, 0, 0.7);
        }

        .summary-hint {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 15px;
        }

        /* 底部导航 */
        .bottom-nav {
            text-align: center;
            padding: 20px;
        }

        .bottom-nav a {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .bottom-nav a:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
            color: rgba(255, 215, 0, 0.8);
        }

        /* 隐藏手稿 */
        .hidden-manuscript {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 99997;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            transition: opacity 1s ease;
        }

        .hidden-manuscript.visible {
            opacity: 1;
        }

        .hidden-manuscript.fade-out {
            opacity: 0;
        }

        .manuscript-paper {
            background: linear-gradient(135deg, #f5e6c8, #e8d5a8);
            color: #2a1a0a;
            padding: 40px 50px;
            border-radius: 4px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            transform: rotate(-1deg);
        }

        .manuscript-title {
            font-size: 0.85rem;
            color: rgba(42, 26, 10, 0.4);
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .manuscript-text {
            font-size: 1.15rem;
            line-height: 2;
            color: rgba(42, 26, 10, 0.85);
            margin-bottom: 20px;
        }

        .manuscript-source {
            font-size: 0.9rem;
            color: rgba(42, 26, 10, 0.5);
        }

        .manuscript-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            color: rgba(42, 26, 10, 0.3);
            cursor: pointer;
            transition: color 0.3s;
        }

        .manuscript-close:hover {
            color: rgba(42, 26, 10, 0.8);
        }

        /* 重置按钮 */
        .reset-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
        }

        /* 移动端 */
        @media (max-width: 768px) {
            .objects-container {
                height: auto;
                min-height: auto;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 30px 20px;
                padding: 20px;
                max-width: 400px;
            }

            .history-object {
                position: relative;
                width: 100%;
                top: auto !important;
                left: auto !important;
            }

            .page-header h1 {
                font-size: 1.8rem;
            }

            .overlay-card {
                padding: 25px;
            }

            .overlay-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>
    <!-- 导航 -->
    <div class="nav-buttons">
        <a href="../../index.html" class="nav-btn" onclick="event.preventDefault(); filmstripTransition('../../index.html');">
            <i class="fas fa-arrow-left"></i> 返回首页
        </a>
    </div>

    <!-- 收集进度 -->
    <div class="collect-bar">
        <i class="fas fa-compass"></i>
        <span id="collectNum">0</span>/10 已探索
    </div>

    <!-- 页面标题 -->
    <div class="page-header">
        <h1>时间博物馆</h1>
        <p>点击历史物件，触摸那个年代的温度</p>
    </div>

    <!-- 物件容器 -->
    <div class="objects-container" id="objectsContainer"></div>

    <!-- 底部总结 -->
    <div class="summary">
        <div class="summary-text" id="summaryText">
            历史不是课本上的文字，是这些人、这些事、这些选择汇聚成的河流。<br>
            你触摸过的每一个物件，都是河流中的一滴水。
        </div>
        <div class="summary-hint" id="summaryHint">探索全部 10 个历史瞬间，解锁完整寄语</div>
    </div>

    <!-- 出生年关联 -->
    <div class="birth-section">
        <label>输入你的出生年，找到属于你的历史坐标</label><br>
        <input type="number" class="birth-input" id="birthInput" min="1920" max="2026" placeholder="2004">
        <div class="birth-result" id="birthResult"></div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav" style="display:flex; gap:10px; align-items:center;">
        <button id="resetBtn" class="reset-btn">
            <i class="fas fa-redo"></i> 重新探索
        </button>
        <a href="../sacrifice_mod4/mod4.html" onclick="event.preventDefault(); filmstripTransition('../sacrifice_mod4/mod4.html', '有些名字被记住了。更多的，连名字都没有留下。');">
            下一个穿越：祭祀大典 <i class="fas fa-arrow-right"></i>
        </a>
    </div>

    <!-- 浮层 -->
    <div class="overlay" id="overlay">
        <button class="overlay-close" id="overlayClose"><i class="fas fa-times"></i></button>
        <div class="overlay-card">
            <div class="overlay-icon" id="overlayIcon"></div>
            <div class="overlay-title" id="overlayTitle"></div>
            <div class="overlay-year" id="overlayYear"></div>
            <div class="overlay-story" id="overlayStory"></div>
        </div>
    </div>

    <script src="../filmstrip.js"></script>
    <script>
        if (typeof filmstripTransition !== 'function') window.filmstripTransition = function(url) { window.location.href = url; };
        if (typeof checkNarrativeTransition !== 'function') window.checkNarrativeTransition = function(cb) { if (cb) cb(); };
        checkNarrativeTransition();

        // 10个历史物件
        const objects = [
            {
                name: '南京条约',
                year: '1842年',
                icon: '📜',
                shape: 'shape-scroll',
                label: '一纸条约',
                story: '1842年，清政府被迫签订《南京条约》，割让香港岛，赔款2100万银元，开放广州、厦门、福州、宁波、上海五处通商口岸。这是中国近代史上第一个不平等条约。签字那天，耆英和伊里布的手在发抖。他们知道，这一签，一个民族的尊严就碎了。从此，中国开始沦为半殖民地半封建社会。一纸条约，压弯了一个民族的脊梁。',
                x: 50, y: 10, rotate: -5
            },
            {
                name: '太平天国旗帜',
                year: '1851年',
                icon: '🚩',
                shape: 'shape-flag',
                label: '一面旗帜',
                story: '1851年，洪秀全在广西金田起义，建号太平天国。这是中国历史上规模最大的农民起义，席卷半个中国，坚持了14年，鼎盛时占据东南半壁江山。虽然最终失败，但它动摇了清王朝的根基。曾国藩说："太平天国之乱，为千古所未有。"它唤醒了后来者——农民阶级救不了中国，需要新的力量。',
                x: 78, y: 18, rotate: 8
            },
            {
                name: '戊戌变法奏折',
                year: '1898年',
                icon: '📃',
                shape: 'shape-paper',
                label: '一道奏折',
                story: '1898年，康有为、梁启超推动光绪帝进行变法，历时103天即告失败。慈禧太后发动政变，光绪被囚禁。谭嗣同拒绝逃亡，说："各国变法，无不从流血而成。今中国未闻有因变法而流血者，此国之所以不昌也。有之，请自嗣同始。"他被押赴菜市口刑场，面不改色，从容就义。百日维新虽短，却播下了变革的种子。',
                x: 15, y: 28, rotate: -3
            },
            {
                name: '辛亥革命手枪',
                year: '1911年',
                icon: '🔫',
                shape: 'shape-gun',
                label: '一声枪响',
                story: '1911年10月10日，武昌起义一声枪响，两千多年的封建帝制轰然倒塌。孙中山说："革命尚未成功，同志仍须努力。"这一枪，打碎了一个旧世界，也开启了一个充满动荡的新时代。清帝退位那天，隆裕太后抱着6岁的溥仪痛哭。一个王朝结束了，但中国的故事才刚刚开始。',
                x: 82, y: 38, rotate: 12
            },
            {
                name: '五四传单',
                year: '1919年',
                icon: '🗞',
                shape: 'shape-paper',
                label: '一张传单',
                story: '1919年5月4日，北京学生走上街头，高喊"外争主权，内除国贼"。32名学生被捕。消息传到上海，工人罢工、商人罢市。这一天，中国青年第一次以一个群体的姿态登上历史舞台。北大教授陈独秀在《新青年》上写道："青年如初春，如朝日，如百卉之萌动。"五四运动不仅是一场爱国运动，更是一场思想启蒙——德先生和赛先生，从此走进了中国。',
                x: 25, y: 50, rotate: -8
            },
            {
                name: '中共一大会议桌',
                year: '1921年',
                icon: '🪑',
                shape: 'shape-table',
                label: '一张桌子',
                story: '1921年7月，13位代表在上海法租界望志路106号的一张桌子旁，召开了中国共产党第一次全国代表大会。他们平均年龄28岁，代表全国50多名党员。会议进行到第7天，一个陌生人闯入会场，代表们立即转移到嘉兴南湖的一条船上继续开会。谁也不知道，这张桌子旁诞生的组织，将改变中国的命运。',
                x: 60, y: 52, rotate: 3
            },
            {
                name: '南昌起义军旗',
                year: '1927年',
                icon: '🏴',
                shape: 'shape-flag',
                label: '一面军旗',
                story: '1927年8月1日凌晨2点，南昌城头一声枪响，中国共产党有了自己的武装力量。起义军2万余人，激战5个小时，占领南昌城。周恩来、贺龙、叶挺、朱德、刘伯承指挥了这次起义。这面军旗，从南昌升起，经过长征、抗日、解放战争，最终插遍了全中国。8月1日，从此成为中国人民解放军的建军节。',
                x: 40, y: 68, rotate: -6
            },
            {
                name: '遵义会议桌',
                year: '1935年',
                icon: '🪑',
                shape: 'shape-table',
                label: '一张会议桌',
                story: '1935年1月，在遵义的一间小屋里，中国共产党做出了一个改变命运的决定：确立毛泽东的领导地位。会议开了三天，争论激烈。博古做了检讨，张闻天做了报告，毛泽东做了长篇发言。周恩来后来说："遵义会议后，我们党才真正懂得了什么叫实事求是。"这张桌子旁的争论，挽救了红军，挽救了党，挽救了中国革命。',
                x: 75, y: 70, rotate: 5
            },
            {
                name: '开国大典话筒',
                year: '1949年',
                icon: '🎙',
                shape: 'shape-mic',
                label: '一个话筒',
                story: '1949年10月1日下午3时，毛泽东站在天安门城楼上，对着这个话筒说："中华人民共和国中央人民政府今天成立了！"广场上30万群众欢声雷动。54门礼炮齐鸣28响——28，代表中国共产党走过的28年。这句话，传遍了全中国，也传遍了全世界。一个新时代，从这个话筒开始。中国人民从此站起来了。',
                x: 20, y: 82, rotate: -4
            },
            {
                name: '改革开放红头文件',
                year: '1978年',
                icon: '📋',
                shape: 'shape-paper',
                label: '一份文件',
                story: '1978年12月，十一届三中全会召开，中国开始了改革开放。邓小平说："贫穷不是社会主义。"这份文件，让中国从封闭走向开放，从贫穷走向富裕。安徽凤阳小岗村18户农民按下的红手印，拉开了农村改革的序幕。40多年后的今天，中国已经成为世界第二大经济体。8亿人摆脱了贫困。一切，从这份文件开始。',
                x: 58, y: 85, rotate: 7
            }
        ];

        // 状态
        let explored = {};
        try { explored = JSON.parse(localStorage.getItem('mod3_explored') || '{}'); } catch(e) { explored = {}; }
        const container = document.getElementById('objectsContainer');
        const overlay = document.getElementById('overlay');
        const overlayIcon = document.getElementById('overlayIcon');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayYear = document.getElementById('overlayYear');
        const overlayStory = document.getElementById('overlayStory');
        const overlayClose = document.getElementById('overlayClose');
        const collectNum = document.getElementById('collectNum');
        const summaryText = document.getElementById('summaryText');
        const summaryHint = document.getElementById('summaryHint');

        let currentObject = null;

        // 创建物件
        function createObjects() {
            // 飞入方向池
            const flyDirs = [
                { x: -120, y: 0 },   // 左
                { x: 120, y: 0 },    // 右
                { x: 0, y: -120 },   // 上
                { x: 0, y: 120 },    // 下
                { x: -100, y: -80 }, // 左上
                { x: 100, y: -80 },  // 右上
                { x: -100, y: 80 },  // 左下
                { x: 100, y: 80 },   // 右下
                { x: -120, y: 30 },
                { x: 120, y: -30 },
            ];

            objects.forEach((obj, i) => {
                const el = document.createElement('div');
                el.className = 'history-object';
                el.dataset.index = i;
                el.style.left = obj.x + '%';
                el.style.top = obj.y + '%';
                el.style.transform = `rotate(${obj.rotate}deg)`;

                if (explored[i]) {
                    el.classList.add('explored');
                }

                el.innerHTML = `
                    <div class="object-icon">
                        <div class="artifact-shape ${obj.shape}"></div>
                    </div>
                    <div class="object-label">${obj.label}</div>
                    <div class="object-year">${obj.year}</div>
                `;

                // 飞入动画 — 从随机方向飞入，错落延迟
                const dir = flyDirs[i % flyDirs.length];
                const delay = 300 + i * 120;
                el.style.opacity = '0';
                el.style.transition = 'none';
                el.style.transform = `rotate(${obj.rotate}deg) translate(${dir.x}px, ${dir.y}px) scale(0.3)`;

                el.addEventListener('click', () => openOverlay(i));
                container.appendChild(el);

                // 延迟后飞入到最终位置
                setTimeout(() => {
                    el.style.transition = 'opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    el.style.opacity = '1';
                    el.style.transform = `rotate(${obj.rotate}deg) translate(0, 0) scale(1)`;
                }, delay);
            });
            updateCollect();
        }

        // 打开浮层
        function openOverlay(index) {
            currentObject = index;
            const obj = objects[index];

            overlayIcon.textContent = obj.icon;
            overlayTitle.textContent = obj.name;
            overlayYear.textContent = obj.year;
            overlayStory.textContent = obj.story;

            overlay.style.display = 'flex';
            requestAnimationFrame(() => {
                overlay.classList.add('active');
            });

            // 标记已探索（首次发现时播放光柱效果）
            if (!explored[index]) {
                explored[index] = true;
                try { localStorage.setItem('mod3_explored', JSON.stringify(explored)); } catch(e) {}
                const el = document.querySelector(`.history-object[data-index="${index}"]`);
                if (el) el.classList.add('explored');
                updateCollect();
                playDiscoveryEffect(el);
            }
        }

        // 发现仪式感效果
        function playDiscoveryEffect(targetEl) {
            if (!targetEl) return;
            const rect = targetEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            // 创建光柱
            const beam = document.createElement('div');
            beam.className = 'discovery-beam';
            beam.innerHTML = `<div class="beam-line" style="left:${cx}px"></div>`;
            document.body.appendChild(beam);

            // 创建粒子
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'discovery-particle';
                p.style.left = (cx + (Math.random() - 0.5) * 60) + 'px';
                p.style.top = (cy + (Math.random() - 0.5) * 30) + 'px';
                p.style.animationDelay = (Math.random() * 0.5) + 's';
                beam.appendChild(p);
            }

            requestAnimationFrame(() => beam.classList.add('active'));

            // 1.5s后清理
            setTimeout(() => {
                beam.remove();
            }, 1800);
        }

        // 关闭浮层
        function closeOverlay() {
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.style.display = 'none';
                currentObject = null;
            }, 500);
        }

        overlayClose.addEventListener('click', closeOverlay);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeOverlay();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeOverlay();
        });

        // 更新收集计数
        function updateCollect() {
            const count = Object.keys(explored).length;
            collectNum.textContent = count;

            // 7个以上解锁隐藏内容
            if (count >= 7) {
                showHiddenContent();
            }

            if (count >= 10) {
                summaryText.classList.add('unlocked');
                summaryHint.style.display = 'none';
            }
        }

        // 隐藏内容 — 毛泽东手稿
        let hiddenShown = false;
        function showHiddenContent() {
            if (hiddenShown) return;
            hiddenShown = true;

            const hidden = document.createElement('div');
            hidden.className = 'hidden-manuscript';
            hidden.innerHTML = `
                <div class="manuscript-paper">
                    <div class="manuscript-title">隐藏发现</div>
                    <div class="manuscript-text">
                        "遵义会议后，红军好像忽然活过来了。<br>
                        我们不再盲目地走，而是有目的地走。<br>
                        不再被动地打，而是主动地打。"
                    </div>
                    <div class="manuscript-source">—— 周恩来</div>
                    <div class="manuscript-close" onclick="this.closest('.manuscript-overlay').remove()">×</div>
                </div>
            `;
            document.body.appendChild(hidden);

            // 淡入
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    hidden.classList.add('visible');
                });
            });

            // 8秒后自动淡出
            setTimeout(() => {
                hidden.classList.add('fade-out');
                setTimeout(() => hidden.remove(), 1000);
            }, 8000);
        }

        // 重置探索
        document.getElementById('resetBtn').addEventListener('click', () => {
            localStorage.removeItem('mod3_explored');
            location.reload();
        });

        // 初始化
        createObjects();

        // 出生年关联
        const birthInput = document.getElementById('birthInput');
        const birthResult = document.getElementById('birthResult');
        const objectYears = objects.map(o => parseInt(o.year));

        birthInput.addEventListener('input', () => {
            const val = parseInt(birthInput.value);
            if (!val || val < 1920 || val > 2026) {
                birthResult.textContent = '';
                document.querySelectorAll('.history-object').forEach(el => el.classList.remove('birth-highlight'));
                return;
            }

            // 找最近的物件
            let closestIdx = 0;
            let closestDist = Infinity;
            objectYears.forEach((y, i) => {
                const dist = Math.abs(y - val);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestIdx = i;
                }
            });

            // 高亮
            document.querySelectorAll('.history-object').forEach(el => el.classList.remove('birth-highlight'));
            const target = document.querySelector(`.history-object[data-index="${closestIdx}"]`);
            if (target) {
                target.classList.add('birth-highlight');
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            const obj = objects[closestIdx];
            const gap = val - objectYears[closestIdx];
            if (gap === 0) {
                birthResult.textContent = `你出生的那年，正是${obj.name}发生的年份。`;
            } else if (gap > 0) {
                birthResult.textContent = `距离${obj.name}已过去 ${gap} 年。你出生时，这段历史已经过去了 ${gap} 年。`;
            } else {
                birthResult.textContent = `${obj.name}发生在你出生前 ${-gap} 年。那是你祖辈的时代。`;
            }
        });
    </script>
</body>

</html>
