<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>觉醒纪念碑 — 赓续红色血脉</title>
    <meta name="description" content="为觉醒年代献上一朵花。">
    <link rel="stylesheet" href="mod12.css">
    <link rel="stylesheet" href="../../shared/css/navigation.css">
    <link rel="stylesheet" href="../../shared/css/reduced-motion.css">
</head>
<body>
    <a href="#monument-area" class="skip-link">跳转到纪念碑</a>

    <!-- 叙事文字 -->
    <div id="narrative-text" class="narrative-text" role="status" aria-live="polite">
        有些名字，我们永远不会知道。<br>但他们值得被记住。<br>献上一朵花，纪念那些觉醒者。
    </div>

    <!-- 花瓣Canvas -->
    <canvas id="petal-canvas" class="petal-canvas" aria-hidden="true"></canvas>

    <!-- 献花按钮 -->
    <div class="offer-area">
        <button id="offer-btn" class="offer-btn" aria-label="献上一朵花">
            <span class="offer-icon">🌸</span>
            <span class="offer-text">献花</span>
        </button>
        <div class="offer-count" aria-live="polite">
            已有 <span id="total-flowers">0</span> 朵花
        </div>
    </div>

    <!-- 纪念碑区域 -->
    <main id="monument-area" class="monument-area" aria-label="觉醒纪念碑">
        <!-- SVG书法标题 -->
        <svg id="title-svg" class="title-svg" viewBox="0 0 400 60">
            <text x="200" y="45" text-anchor="middle" class="title-text-path">觉醒纪念碑</text>
        </svg>

        <!-- 纪念碑主体 -->
        <div id="monument" class="monument">
            <div class="monument-top">碑</div>
            <div id="monument-body" class="monument-body"></div>
        </div>

        <!-- 献花记录 -->
        <div class="flower-record">
            <h2 class="record-title">献花者</h2>
            <div id="flower-names" class="flower-names"></div>
        </div>
    </main>

    <!-- 名字输入弹窗 -->
    <div id="name-modal" class="name-modal" role="dialog" aria-modal="true">
        <div class="modal-inner">
            <h2 class="modal-title">留下你的名字</h2>
            <p class="modal-desc">你的名字将刻在纪念碑上</p>
            <input id="name-input" class="name-input" type="text" placeholder="你的名字" maxlength="10" autocomplete="off">
            <div class="modal-btns">
                <button id="modal-skip" class="modal-btn secondary">匿名</button>
                <button id="modal-confirm" class="modal-btn primary">确认</button>
            </div>
        </div>
    </div>

    <!-- 结尾 -->
    <div id="ending" class="ending" aria-label="结束">
        <h2 class="ending-title">觉醒</h2>
        <p class="ending-text">
            每一朵花，都是一份纪念。<br>
            每一个名字，都是一份传承。<br><br>
            觉醒不是一个人的事，<br>
            而是一代又一代人的接力。
        </p>
        <div class="ending-number" id="ending-number">0</div>
        <div class="ending-label">朵花，献给觉醒年代</div>
    </div>

    <script src="../../page/filmstrip.js"></script>
    <script src="../../shared/js/storage.js"></script>
    <script src="../../shared/js/navigation.js"></script>
    <script src="../../shared/js/audio-engine.js"></script>
    <script src="../../shared/js/reduced-motion.js"></script>
    <script src="mod12.js"></script>
    <script>createNavigation(12);</script>
</body>
</html>
