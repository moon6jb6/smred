<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祭祀大典 — 黑暗中的铭记</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #f5f5f5;
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @media (hover: hover) and (pointer: fine) {
            body {
                cursor: none;
            }
        }

        /* 开场黑屏 */
        .mod4-intro {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease;
        }

        .mod4-intro.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .mod4-intro-text {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 4px;
            opacity: 0;
            animation: introFadeIn 2s ease 1s forwards;
        }

        @keyframes introFadeIn {
            to { opacity: 1; }
        }

        /* ========== 三层光晕 ========== */
        .glow-outer {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 9996;
            transform: translate(-50%, -50%);
            transition: left 0.4s ease-out, top 0.4s ease-out;
        }

        .glow-mid {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, rgba(255, 180, 0, 0.03) 40%, transparent 70%);
            pointer-events: none;
            z-index: 9997;
            transform: translate(-50%, -50%);
            transition: left 0.25s ease-out, top 0.25s ease-out;
        }

        .glow-inner {
            position: fixed;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, rgba(255, 180, 0, 0.06) 40%, transparent 70%);
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: left 0.12s ease-out, top 0.12s ease-out;
        }

        /* ========== 提示文字 ========== */
        .hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 1.2rem;
            letter-spacing: 4px;
            z-index: 1;
            pointer-events: none;
            transition: opacity 2s;
        }

        .hint.hidden {
            opacity: 0;
        }

        /* ========== 导航 ========== */
        .nav-buttons {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
            color: rgba(255, 215, 0, 0.8);
        }

        /* ========== 剪影容器 ========== */
        .silhouettes-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* ========== 单个剪影 ========== */
        .silhouette {
            position: absolute;
            width: 80px;
            height: 120px;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 1.2s ease, transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 10;
        }

        .silhouette.visible {
            opacity: 1;
            transform: scale(1);
        }

        .silhouette.discovered {
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.9; }
        }

        .silhouette.glow {
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)) drop-shadow(0 0 30px rgba(255, 215, 0, 0.3));
            opacity: 1;
        }

        /* 人形轮廓 */
        .silhouette-shape {
            width: 100%;
            height: 100%;
            clip-path: ellipse(22% 28% at 50% 22%);
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.6s;
            position: relative;
        }

        .silhouette-shape::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 70%;
            background: inherit;
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            border-radius: 50% 50% 0 0 / 30% 30% 0 0;
        }

        .silhouette.glow .silhouette-shape {
            background: var(--accent, rgba(255, 215, 0, 0.5));
        }

        .silhouette.discovered .silhouette-shape {
            background: var(--accent, rgba(255, 215, 0, 0.3));
            opacity: 0.8;
        }

        .silhouette-role {
            font-size: 0.6rem;
            color: rgba(201, 169, 110, 0.6);
            text-align: center;
            margin-top: 2px;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.6s;
        }
        .silhouette.glow .silhouette-role,
        .silhouette.discovered .silhouette-role {
            opacity: 1;
        }

        /* 剪影标签 */
        .silhouette-label {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            text-align: center;
            transition: opacity 0.6s;
            pointer-events: none;
        }

        .silhouette-label .label-name {
            font-size: 0.85rem;
            color: rgba(255, 215, 0, 0);
            letter-spacing: 2px;
            transition: color 0.6s;
            display: block;
        }

        .silhouette-label .label-years {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0);
            transition: color 0.6s;
            margin-top: 3px;
            display: block;
        }

        .silhouette.glow .silhouette-label .label-name,
        .silhouette.discovered .silhouette-label .label-name {
            color: rgba(255, 215, 0, 0.7);
        }

        .silhouette.glow .silhouette-label .label-years,
        .silhouette.discovered .silhouette-label .label-years {
            color: rgba(255, 255, 255, 0.35);
        }

        /* ========== 浮现语录（无需弹层） ========== */
        .quote-float {
            position: absolute;
            max-width: 500px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
            z-index: 50;
            pointer-events: none;
        }

        .quote-float.active {
            opacity: 1;
            transform: translateY(0);
        }

        .quote-float.fade-out {
            opacity: 0;
            transform: translateY(-15px);
        }

        .quote-float .qf-text {
            font-size: 1.3rem;
            line-height: 2;
            color: rgba(255, 215, 0, 0.85);
            font-style: italic;
            padding: 0 20px;
            position: relative;
        }

        .quote-float .qf-text::before {
            content: "\201C";
            position: absolute;
            top: -25px;
            left: -5px;
            font-size: 4rem;
            color: rgba(255, 215, 0, 0.12);
            font-family: serif;
            line-height: 1;
        }

        .quote-float .qf-title {
            font-size: 0.85rem;
            color: rgba(255, 215, 0, 0.6);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .quote-float .qf-detail {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.8;
            margin-top: 10px;
            padding: 0 20px;
        }

        .quote-float .qf-source {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 15px;
        }

        /* ========== 底部烛光汇聚 ========== */
        .candle-gathering {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 3;
            pointer-events: none;
        }

        .mini-flame {
            width: 8px;
            height: 14px;
            background: radial-gradient(ellipse at bottom, #ffd700 0%, #ff8c00 50%, transparent 80%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.8s, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .mini-flame.on {
            opacity: 1;
            transform: scale(1);
            animation: miniFlameDance 0.6s infinite alternate;
        }

        @keyframes miniFlameDance {
            0% { transform: scale(1) rotate(-3deg); }
            100% { transform: scale(1.1, 0.9) rotate(3deg); }
        }

        /* 风吹效果 */
        .mini-flame.on.wind {
            animation: miniFlameWind 0.4s ease-in-out;
        }

        @keyframes miniFlameWind {
            0% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(0.8, 1.2) rotate(-12deg); }
            60% { transform: scale(1.1, 0.9) rotate(8deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* ========== 终极信息 ========== */
        .final-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .final-message.active {
            opacity: 1;
        }

        .final-message .fm-text {
            font-size: 2rem;
            color: #ffd700;
            letter-spacing: 6px;
            line-height: 2;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }

        .final-message .fm-sub {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 20px;
            letter-spacing: 3px;
        }

        /* ========== 底部文字 ========== */
        .bottom-text {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.75rem;
            letter-spacing: 3px;
            z-index: 1;
            pointer-events: none;
        }

        /* ========== 底部导航 ========== */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
        }

        .bottom-nav a {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bottom-nav a:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
            color: rgba(255, 215, 0, 0.8);
        }

        /* ========== 移动端 ========== */
        @media (max-width: 768px) {
            body { cursor: auto; }
            .glow-outer, .glow-mid, .glow-inner { display: none; }
            .hint { font-size: 0.95rem; padding: 0 20px; text-align: center; }
            .silhouette { width: 60px; height: 90px; }
            .silhouette-label .label-name { font-size: 0.75rem; }
            .quote-float .qf-text { font-size: 1.05rem; }
            .final-message .fm-text { font-size: 1.4rem; letter-spacing: 3px; }
            .nav-buttons { top: 10px; left: 10px; }
            .nav-btn { padding: 6px 12px; font-size: 0.8rem; }
        }

        @media (max-width: 480px) {
            .silhouette { width: 50px; height: 75px; }
            .quote-float .qf-text { font-size: 0.95rem; }
            .final-message .fm-text { font-size: 1.2rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .silhouette { transition: none; }
            .silhouette.discovered { animation: none; }
            .mini-flame.on { animation: none; }
            .mini-flame.on.wind { animation: none; }
            .glow-outer, .glow-mid, .glow-inner { transition: none; }
            .quote-float { transition: none; }
            .mod4-intro-text { animation: none; opacity: 1; }
        }

        .silhouette:focus-visible {
            outline: 2px solid #ffd700;
            outline-offset: 4px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <!-- 开场黑屏 -->
    <div class="mod4-intro" id="mod4Intro">
        <div class="mod4-intro-text">黑暗中，有人在等你发现</div>
    </div>

    <!-- 三层光晕 -->
    <div class="glow-outer" id="glowOuter"></div>
    <div class="glow-mid" id="glowMid"></div>
    <div class="glow-inner" id="glowInner"></div>

    <!-- 提示 -->
    <div class="hint" id="hint">移动鼠标，照亮黑暗中的人</div>

    <!-- 导航 -->
    <div class="nav-buttons">
        <a href="../../index.html" class="nav-btn" onclick="event.preventDefault(); filmstripTransition('../../index.html');">
            <i class="fas fa-arrow-left"></i> 返回首页
        </a>
    </div>

    <!-- 剪影容器 -->
    <div class="silhouettes-container" id="silContainer"></div>

    <!-- 浮现语录 -->
    <div class="quote-float" id="quoteFloat" role="status" aria-live="polite">
        <div class="qf-title" id="qfTitle"></div>
        <div class="qf-text" id="qfText"></div>
        <div class="qf-detail" id="qfDetail"></div>
        <div class="qf-source" id="qfSource"></div>
    </div>

    <!-- 底部烛光汇聚 -->
    <div class="candle-gathering" id="candleGathering"></div>

    <!-- 终极信息 -->
    <div class="final-message" id="finalMessage">
        <div class="fm-text">他们说，不要忘记我们。</div>
        <div class="fm-sub">你已点亮全部 12 盏烛光</div>
    </div>

    <!-- 底部文字 -->
    <div class="bottom-text">英雄是民族最闪亮的坐标</div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <a href="../greatman_mod5/mod5.html" onclick="event.preventDefault(); filmstripTransition('../greatman_mod5/mod5.html', '但有一个人，他的选择改变了一切。');">
            下一个穿越：新中国之父 <i class="fas fa-arrow-right"></i>
        </a>
    </div>

    <script src="../filmstrip.js"></script>
    <script>
        if (typeof filmstripTransition !== 'function') window.filmstripTransition = function(url) { window.location.href = url; };
        if (typeof checkNarrativeTransition !== 'function') window.checkNarrativeTransition = function(cb) { if (cb) cb(); };
        checkNarrativeTransition();

        // 开场黑屏 + 呼吸声
        const mod4Intro = document.getElementById('mod4Intro');
        let audioCtx = null;

        // 呼吸声（Web Audio API — 低频噪声脉冲）
        function startBreathing() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // 确保 AudioContext 处于运行状态
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                // 创建噪声源
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * 0.15;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                noise.loop = true;

                // 低通滤波 — 让噪声听起来像呼吸
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 300;

                // 增益控制 — 呼吸节奏脉冲
                const gain = audioCtx.createGain();
                gain.gain.value = 0;

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();

                // 呼吸节奏：0→0.15→0，4秒一个周期
                function breathe() {
                    const now = audioCtx.currentTime;
                    gain.gain.cancelScheduledValues(now);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.08, now + 1.5);
                    gain.gain.linearRampToValueAtTime(0, now + 3.5);
                }
                breathe();
                const breathInterval = setInterval(breathe, 4000);

                // 6秒后淡出并停止
                setTimeout(() => {
                    clearInterval(breathInterval);
                    const now = audioCtx.currentTime;
                    gain.gain.cancelScheduledValues(now);
                    gain.gain.linearRampToValueAtTime(0, now + 2);
                    setTimeout(() => {
                        noise.stop();
                        audioCtx.close();
                    }, 2500);
                }, 6000);
            } catch(e) { /* 静默失败 */ }
        }

        // 3秒后淡出黑屏
        setTimeout(() => {
            startBreathing();
        }, 500);

        // 用户首次交互时恢复被阻止的 AudioContext
        function resumeAudio() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            document.removeEventListener('click', resumeAudio);
            document.removeEventListener('touchstart', resumeAudio);
        }
        document.addEventListener('click', resumeAudio);
        document.addEventListener('touchstart', resumeAudio);

        setTimeout(() => {
            mod4Intro.classList.add('fade-out');
            setTimeout(() => mod4Intro.remove(), 1500);
        }, 3000);

        // 人物数据
        const heroes = [
            {
                name: '钱学森', years: '1911 — 2009',
                title: '中国航天之父',
                role: '科学家', accent: 'rgba(100,180,255,0.4)',
                achievement: '冲破美国阻挠回国，主持研制了中国第一枚导弹和第一颗人造卫星',
                detail: '美国海军次长金布尔说："他无论走到哪里，都抵得上五个师的兵力。"钱学森被软禁5年，1955年终于回到祖国。他带领团队用算盘和手摇计算机，算出了导弹的轨道参数。',
                quote: '我的事业在中国，我的成就在中国，我的归宿在中国。',
                source: '—— 钱学森回国后接受采访时说'
            },
            {
                name: '袁隆平', years: '1930 — 2021',
                title: '杂交水稻之父',
                role: '科学家', accent: 'rgba(100,200,100,0.4)',
                achievement: '研发杂交水稻，让中国用世界7%的耕地养活了世界22%的人口',
                detail: '袁隆平在稻田里蹲了半个世纪，找到了天然雄性不育株。他的杂交水稻让亩产从300公斤提高到800公斤。有人问他成功的秘诀，他说："我不在家就在试验田，不在试验田就在去试验田的路上。"',
                quote: '我毕生的追求就是让所有人远离饥饿。',
                source: '—— 袁隆平接受央视采访'
            },
            {
                name: '黄旭华', years: '1926 — 2020',
                title: '中国核潜艇之父',
                role: '科学家', accent: 'rgba(80,150,220,0.4)',
                achievement: '隐姓埋名30年，主持研制了中国第一代核潜艇',
                detail: '1958年，黄旭华接到秘密任务，从此消失在家人视野中。30年里，母亲不知道他在做什么，只能从报纸上猜测。1987年，母亲看到一篇关于核潜艇的报道，才终于明白儿子在做什么。她说："三哥的事情，大家要谅解。"',
                quote: '对国家的忠，就是对父母最大的孝。',
                source: '—— 黄旭华谈隐姓埋名30年'
            },
            {
                name: '张富清', years: '1924 — 2022',
                title: '战斗英雄·人民公仆',
                role: '战士', accent: 'rgba(220,120,100,0.4)',
                achievement: '解放战争中立下特等功，却深藏功名60余年，在偏远山区默默奉献',
                detail: '张富清在永丰战役中，一人炸毁敌人两座碉堡，缴获重机枪两挺。立下特等功的他，转业后主动申请到湖北最偏远的来凤县工作，一干就是一辈子。60多年里，连妻子都不知道他的战功。',
                quote: '我是党培养的，我要永远听党话，跟党走。',
                source: '—— 张富清在部队时说的话'
            },
            {
                name: '邓稼先', years: '1924 — 1986',
                title: '两弹元勋',
                role: '科学家', accent: 'rgba(255,180,80,0.4)',
                achievement: '主持研制了中国第一颗原子弹和第一颗氢弹',
                detail: '1958年，邓稼先接到研制原子弹的任务。他告别妻子许鹿希，消失在戈壁滩。28年后他回来时，已经因为核辐射身患癌症。临终前他说："我对这一生没有遗憾。"',
                quote: '做好了这件事情，我这一生就过得很有意义，就是为它死了也值得。',
                source: '—— 邓稼先接受核武器研制任务时说'
            },
            {
                name: '焦裕禄', years: '1922 — 1964',
                title: '人民的好书记',
                role: '公仆', accent: 'rgba(220,200,100,0.4)',
                achievement: '在兰考带领群众治理风沙、内涝、盐碱三害，积劳成疾以身殉职',
                detail: '焦裕禄到兰考上任时，正是兰考最困难的时期。他带着干部走遍全县149个大队，摸清了风口、沙丘、河渠的位置。他的藤椅右边被顶出一个大窟窿——那是肝疼时用来顶住的。他去世时年仅42岁。',
                quote: '我们不是人民的上司，我们都是人民的勤务员。',
                source: '—— 焦裕禄在兰考工作时说'
            },
            {
                name: '雷锋', years: '1940 — 1962',
                title: '人民的勤务兵',
                role: '战士', accent: 'rgba(220,100,100,0.4)',
                achievement: '用短暂的22年生命诠释了"为人民服务"的真谛',
                detail: '雷锋7岁成为孤儿，是党和人民把他养大。他把每个月6元津贴中的大部分用来帮助别人。他在日记中写道："人的生命是有限的，可是，为人民服务是无限的。"22岁因公殉职，毛泽东亲笔题词"向雷锋同志学习"。',
                quote: '人的生命是有限的，可是，为人民服务是无限的，我要把有限的生命，投入到无限的为人民服务之中去。',
                source: '—— 《雷锋日记》'
            },
            {
                name: '孙家栋', years: '1929 — 2023',
                title: '卫星之父',
                role: '科学家', accent: 'rgba(100,160,240,0.4)',
                achievement: '主持研制了中国第一颗人造卫星"东方红一号"和北斗导航系统',
                detail: '1970年4月24日，东方红一号卫星成功发射，太空中传来了《东方红》乐曲。孙家栋说那一刻他哭了。此后他又主持了北斗导航、嫦娥探月等重大工程。他说："国家需要，我就去做。"这句话他践行了一辈子。',
                quote: '国家需要，我就去做。',
                source: '—— 孙家栋谈一生航天事业'
            },
            {
                name: '于敏', years: '1926 — 2019',
                title: '氢弹之父',
                role: '科学家', accent: 'rgba(240,160,80,0.4)',
                achievement: '用2年8个月研制出中国第一颗氢弹，创造了世界最快纪录',
                detail: '于敏从未出过国，被称为"土专家"。他带领团队用算盘和手摇计算机，完成了氢弹理论的突破。1967年6月17日，中国第一颗氢弹爆炸成功。从原子弹到氢弹，美国用了7年4个月，苏联用了6年3个月，中国只用了2年8个月。',
                quote: '一个人的名字，早晚是没有的，能把微薄的力量融进祖国的强盛之中，便足以自慰了。',
                source: '—— 于敏获国家最高科学技术奖后说'
            },
            {
                name: '张自忠', years: '1891 — 1940',
                title: '抗日名将·民族英雄',
                role: '将军', accent: 'rgba(200,80,80,0.4)',
                achievement: '枣宜会战中壮烈殉国，是二战中盟军牺牲的最高将领',
                detail: '1940年5月，日军进攻枣阳。张自忠亲率1500人渡过襄河，与数万日军血战。部下劝他撤退，他说："我今天要血战到底！"身中数弹后，他仍然坚持指挥。殉国时，他的身上有7处伤口。日军发现他的遗体后，列队敬礼。',
                quote: '国家到了如此地步，除我等为其死，毫无其他办法。',
                source: '—— 张自忠殉国前致战友书'
            },
            {
                name: '赵一曼', years: '1905 — 1936',
                title: '抗日女英雄',
                role: '抗联政委', accent: 'rgba(200,80,120,0.4)',
                achievement: '领导东北抗日武装斗争，被捕后受尽酷刑仍不屈服',
                detail: '赵一曼被日军俘虏后，遭受了长达9个月的酷刑。电刑、灌辣椒水、用烧红的烙铁烫……她始终没有泄露任何信息。临刑前，她给儿子写了一封遗书："母亲不用千言万语来教育你，就用实行来教育你。"',
                quote: '未惜头颅新故国，甘将热血沃中华。',
                source: '—— 赵一曼就义前诗'
            },
            {
                name: '杨靖宇', years: '1905 — 1940',
                title: '东北抗联总司令',
                role: '抗联司令', accent: 'rgba(180,60,60,0.4)',
                achievement: '在零下40度的林海雪原中孤身与日军周旋，战斗到最后一刻',
                detail: '1940年2月，杨靖宇被日军包围在濛江县。他已经5天没有吃东西，身边只剩两个战士。他命令战士突围，自己留下掩护。牺牲后，日军剖开他的胃，发现里面只有棉絮、树皮和草根。连敌人都不得不敬佩他。',
                quote: '我们中国人都投降了，还有中国吗？',
                source: '—— 杨靖宇殉国前对劝降者说'
            }
        ];

        // 剪影位置（环形排列）
        const positions = [
            { x: 50, y: 15 }, { x: 72, y: 20 }, { x: 86, y: 34 },
            { x: 88, y: 52 }, { x: 78, y: 68 }, { x: 62, y: 78 },
            { x: 42, y: 80 }, { x: 25, y: 70 }, { x: 14, y: 55 },
            { x: 14, y: 38 }, { x: 25, y: 24 }, { x: 38, y: 16 }
        ];

        // 状态
        let discovered = {};
        try { discovered = JSON.parse(localStorage.getItem('mod4_candles') || '{}'); } catch(e) { discovered = {}; }
        const container = document.getElementById('silContainer');
        const glowOuter = document.getElementById('glowOuter');
        const glowMid = document.getElementById('glowMid');
        const glowInner = document.getElementById('glowInner');
        const hint = document.getElementById('hint');
        const quoteFloat = document.getElementById('quoteFloat');
        const qfTitle = document.getElementById('qfTitle');
        const qfText = document.getElementById('qfText');
        const qfDetail = document.getElementById('qfDetail');
        const qfSource = document.getElementById('qfSource');
        const candleGathering = document.getElementById('candleGathering');
        const finalMessage = document.getElementById('finalMessage');

        let hintHidden = false;
        let quoteTimer = null;
        const discoveredSet = new Set(Object.keys(discovered).map(Number));

        // 创建底部烛光
        for (let i = 0; i < 12; i++) {
            const flame = document.createElement('div');
            flame.className = 'mini-flame';
            flame.dataset.index = i;
            if (discovered[i]) flame.classList.add('on');
            candleGathering.appendChild(flame);
        }

        // 创建剪影
        let cachedSilhouettes = [];

        function createSilhouettes() {
            heroes.forEach((hero, i) => {
                const el = document.createElement('div');
                el.className = 'silhouette';
                el.dataset.index = i;
                el.style.left = positions[i].x + '%';
                el.style.top = positions[i].y + '%';
                el.style.transform = 'translate(-50%, -50%) scale(0.5)';

                if (discoveredSet.has(i)) {
                    el.classList.add('discovered');
                }

                el.innerHTML = `
                    <div class="silhouette-shape" style="--accent:${hero.accent || 'rgba(255,215,0,0.5)'}"></div>
                    <div class="silhouette-role">${hero.role || ''}</div>
                    <div class="silhouette-label">
                        <span class="label-name">${hero.name}</span>
                        <span class="label-years">${hero.title || hero.years}</span>
                    </div>
                `;

                el.setAttribute('role', 'button');
                el.setAttribute('tabindex', '0');
                el.setAttribute('aria-label', hero.name + ' — ' + (hero.title || hero.role));
                const revealFn = (e) => { e.stopPropagation(); revealQuote(i); };
                el.addEventListener('click', revealFn);
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); revealFn(e); }
                });

                container.appendChild(el);
            });
            cachedSilhouettes = Array.from(document.querySelectorAll('.silhouette'));
        }

        // 英雄找用户：依次自动亮起
        function revealSilhouettes() {
            const els = document.querySelectorAll('.silhouette');
            els.forEach((el, i) => {
                setTimeout(() => {
                    el.classList.add('visible');
                    if (el.classList.contains('discovered')) {
                        el.style.transform = 'translate(-50%, -50%) scale(1)';
                    } else {
                        el.style.transform = 'translate(-50%, -50%) scale(1)';
                    }
                }, i * 400);
            });
        }

        // 鼠标追踪：三层光晕 + 延迟跟随
        document.addEventListener('mousemove', (e) => {
            glowOuter.style.left = e.clientX + 'px';
            glowOuter.style.top = e.clientY + 'px';
            glowMid.style.left = e.clientX + 'px';
            glowMid.style.top = e.clientY + 'px';
            glowInner.style.left = e.clientX + 'px';
            glowInner.style.top = e.clientY + 'px';

            // 检测剪影距离（使用缓存的元素列表）
            cachedSilhouettes.forEach(el => {
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.hypot(e.clientX - cx, e.clientY - cy);

                if (dist < 180) {
                    el.classList.add('glow');
                } else {
                    el.classList.remove('glow');
                }
            });

            if (!hintHidden) {
                hint.classList.add('hidden');
                hintHidden = true;
            }
        });

        // 触摸支持
        document.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            glowOuter.style.left = t.clientX + 'px';
            glowOuter.style.top = t.clientY + 'px';
            glowMid.style.left = t.clientX + 'px';
            glowMid.style.top = t.clientY + 'px';
            glowInner.style.left = t.clientX + 'px';
            glowInner.style.top = t.clientY + 'px';
            cachedSilhouettes.forEach(el => {
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.hypot(t.clientX - cx, t.clientY - cy);
                if (dist < 120) {
                    el.classList.add('glow');
                } else {
                    el.classList.remove('glow');
                }
            });
        });

        // 设备倾斜控制光晕（移动端）
        if (window.DeviceOrientationEvent) {
            let tiltActive = false;
            const startTilt = (e) => {
                if (e.gamma === null) return;
                tiltActive = true;
                const x = window.innerWidth * (0.5 + e.gamma / 60);
                const y = window.innerHeight * (0.5 + e.beta / 60);
                glowOuter.style.left = x + 'px';
                glowOuter.style.top = y + 'px';
                glowMid.style.left = x + 'px';
                glowMid.style.top = y + 'px';
                glowInner.style.left = x + 'px';
                glowInner.style.top = y + 'px';
                cachedSilhouettes.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const dist = Math.hypot(x - cx, y - cy);
                    if (dist < 180) el.classList.add('glow');
                    else el.classList.remove('glow');
                });
            };
            // iOS 13+ 需要请求权限
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.addEventListener('click', function reqPerm() {
                    DeviceOrientationEvent.requestPermission().then(r => {
                        if (r === 'granted') window.addEventListener('deviceorientation', startTilt);
                    });
                    document.removeEventListener('click', reqPerm);
                }, { once: true });
            } else {
                window.addEventListener('deviceorientation', startTilt);
            }
        }

        // 点击剪影 → 语录浮现（无需弹层）
        function revealQuote(index) {
            const hero = heroes[index];
            const el = document.querySelector(`.silhouette[data-index="${index}"]`);

            // 设置语录内容
            qfTitle.textContent = hero.name + ' · ' + (hero.title || '');
            qfText.textContent = hero.quote;
            qfDetail.textContent = hero.achievement || '';
            qfSource.textContent = hero.source;

            // 定位语录到剪影附近
            const rect = el.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            quoteFloat.style.left = Math.max(10, Math.min(rect.left - containerRect.left - 100, window.innerWidth - 520)) + 'px';
            quoteFloat.style.top = (rect.top - containerRect.top - 60) + 'px';

            // 显示语录
            clearTimeout(quoteTimer);
            quoteFloat.classList.remove('active', 'fade-out');
            requestAnimationFrame(() => {
                quoteFloat.classList.add('active');
            });

            // 标记已发现
            if (!discoveredSet.has(index)) {
                discoveredSet.add(index);
                discovered[index] = true;
                try { localStorage.setItem('mod4_candles', JSON.stringify(discovered)); } catch(e) {}

                el.classList.add('discovered');

                // 点亮底部烛光
                const miniFlame = document.querySelector(`.mini-flame[data-index="${index}"]`);
                if (miniFlame) miniFlame.classList.add('on');

                // 检查是否全部点亮
                if (discoveredSet.size >= 12) {
                    setTimeout(showFinalMessage, 3000);
                }
            }

            // 5秒后语录淡出
            quoteTimer = setTimeout(() => {
                quoteFloat.classList.add('fade-out');
                setTimeout(() => {
                    quoteFloat.classList.remove('active', 'fade-out');
                }, 1000);
            }, 5000);
        }

        // 全部点亮 → 终极信息 + 光晕汇聚纪念碑
        function showFinalMessage() {
            quoteFloat.classList.remove('active');

            // 光晕汇聚到屏幕中央
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            glowOuter.style.transition = 'all 3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            glowMid.style.transition = 'all 3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            glowInner.style.transition = 'all 3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            glowOuter.style.left = cx + 'px';
            glowOuter.style.top = cy + 'px';
            glowOuter.style.width = '600px';
            glowOuter.style.height = '600px';
            glowOuter.style.background = 'radial-gradient(circle, rgba(255,215,0,0.08) 0%, transparent 60%)';
            glowMid.style.left = cx + 'px';
            glowMid.style.top = cy + 'px';
            glowMid.style.width = '400px';
            glowMid.style.height = '400px';
            glowMid.style.background = 'radial-gradient(circle, rgba(255,215,0,0.12) 0%, rgba(255,180,0,0.05) 40%, transparent 70%)';
            glowInner.style.left = cx + 'px';
            glowInner.style.top = cy + 'px';
            glowInner.style.width = '200px';
            glowInner.style.height = '200px';
            glowInner.style.background = 'radial-gradient(circle, rgba(255,215,0,0.2) 0%, rgba(255,180,0,0.08) 40%, transparent 70%)';

            // 剪影们缓缓走向中心
            cachedSilhouettes.forEach((el, i) => {
                el.style.transition = 'all 3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                el.style.left = '50%';
                el.style.top = '50%';
                el.style.opacity = '0.3';
                el.style.transform = 'translate(-50%, -50%) scale(0.6)';
            });

            setTimeout(() => finalMessage.classList.add('active'), 2000);

            setTimeout(() => {
                finalMessage.classList.remove('active');
                // 恢复光晕跟随
                glowOuter.style.transition = 'left 0.4s ease-out, top 0.4s ease-out';
                glowMid.style.transition = 'left 0.25s ease-out, top 0.25s ease-out';
                glowInner.style.transition = 'left 0.12s ease-out, top 0.12s ease-out';
            }, 10000);
        }

        // 初始化
        createSilhouettes();
        setTimeout(revealSilhouettes, 3000);

        // 如果全部已点亮，延迟显示终极信息
        if (discoveredSet.size >= 12) {
            setTimeout(showFinalMessage, 6000);
        }

        // 蜡烛"风"效果 — 每隔随机时间，所有已点亮的蜡烛同时摇摆
        function triggerWind() {
            const onFlames = document.querySelectorAll('.mini-flame.on');
            onFlames.forEach(flame => flame.classList.add('wind'));
            setTimeout(() => {
                onFlames.forEach(flame => flame.classList.remove('wind'));
            }, 400);
            // 下一次风吹：3-8秒后
            setTimeout(triggerWind, 3000 + Math.random() * 5000);
        }
        setTimeout(triggerWind, 5000 + Math.random() * 3000);
    </script>
</body>
