<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赓续红色血脉，传承奋斗精神</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Heiti SC', Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== 开场黑屏 + 钩子文字 ========== */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 1.2s ease;
        }

        .intro-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .hook-text {
            font-size: 2rem;
            color: rgba(255, 215, 0, 0.9);
            letter-spacing: 4px;
            line-height: 1.8;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease;
            max-width: 90%;
        }

        .intro-overlay.show-text .hook-text {
            opacity: 1;
        }

        /* ========== 主内容区 ========== */
        .main-scene {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a00 0%, #2d1500 40%, #1a0a00 100%);
            overflow: hidden;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .main-scene.visible {
            opacity: 1;
        }

        /* 题目 */
        .scene-title {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .scene-title h1 {
            font-size: 2.2rem;
            color: #ffd700;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            margin-bottom: 8px;
        }

        .scene-title p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 2px;
        }

        /* ========== 土路 ========== */
        .road-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .road {
            position: absolute;
            bottom: 8%;
            left: 5%;
            width: 110%;
            height: 6px;
            background: linear-gradient(90deg, #5a3a1a, #8b6914, #a0845c, #5a3a1a);
            transform-origin: bottom left;
            transform: rotate(-18deg);
            border-radius: 3px;
            box-shadow: 0 0 20px rgba(139, 105, 20, 0.3), 0 0 60px rgba(139, 105, 20, 0.1);
        }

        .road::before,
        .road::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            left: 0;
        }

        .road::before {
            top: -8px;
            background: linear-gradient(90deg, transparent, rgba(139, 105, 20, 0.3), transparent);
        }

        .road::after {
            bottom: -8px;
            background: linear-gradient(90deg, transparent, rgba(139, 105, 20, 0.3), transparent);
        }

        /* 路面纹理 */
        .road-texture {
            position: absolute;
            bottom: 8%;
            left: 5%;
            width: 110%;
            height: 60px;
            transform-origin: bottom left;
            transform: rotate(-18deg);
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 80px,
                rgba(139, 105, 20, 0.15) 80px,
                rgba(139, 105, 20, 0.15) 82px
            );
            pointer-events: none;
        }

        /* 年份标签 */
        .year-label {
            position: absolute;
            font-size: 1.1rem;
            font-weight: bold;
            color: rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
            z-index: 5;
        }

        .year-start {
            bottom: 6%;
            left: 4%;
        }

        .year-end {
            top: 26%;
            right: 6%;
        }

        /* ========== 路标 ========== */
        .marker {
            position: absolute;
            z-index: 10;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .marker-post {
            width: 4px;
            height: 60px;
            background: linear-gradient(180deg, #8b6914, #5a3a1a);
            margin: 0 auto;
            border-radius: 2px;
            transition: all 0.4s ease;
            position: relative;
        }

        .marker-sign {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #3a2010, #5a3a1a);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 6px;
            padding: 10px 18px;
            white-space: nowrap;
            text-align: center;
            transition: all 0.4s ease;
            min-width: 140px;
        }

        .marker-sign .sign-icon {
            font-size: 1.4rem;
            color: #ffd700;
            display: block;
            margin-bottom: 5px;
            transition: all 0.4s ease;
        }

        .marker-sign .sign-name {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.4s ease;
        }

        .marker-sign .sign-preview {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0);
            margin-top: 5px;
            line-height: 1.4;
            transition: all 0.4s ease;
            max-height: 0;
            overflow: hidden;
        }

        /* 路标悬停 */
        .marker:hover .marker-post {
            height: 70px;
            background: linear-gradient(180deg, #ffd700, #8b6914);
        }

        .marker:hover .marker-sign {
            border-color: rgba(255, 215, 0, 0.8);
            background: linear-gradient(135deg, #3a2010, #6a4a2a);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
            transform: translateX(-50%) translateY(-5px);
        }

        .marker:hover .sign-icon {
            color: #ffea00;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .marker:hover .sign-name {
            color: #ffd700;
        }

        .marker:hover .sign-preview {
            color: rgba(255, 215, 0, 0.7);
            max-height: 50px;
            margin-top: 6px;
        }

        /* 路标底部光点 */
        .marker-glow {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.15);
            transition: all 0.4s ease;
        }

        .marker:hover .marker-glow {
            background: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            width: 16px;
            height: 16px;
        }

        /* 路标位置 — 沿路分布 */
        .marker-1 { left: 12%; bottom: 26%; }
        .marker-2 { left: 25%; bottom: 32%; }
        .marker-3 { left: 38%; bottom: 38%; }
        .marker-4 { left: 52%; bottom: 44%; }
        .marker-5 { left: 66%; bottom: 50%; }
        .marker-6 { left: 80%; bottom: 56%; }

        /* ========== 底部寄语 ========== */
        .scene-footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .scene-footer p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .hook-text {
                font-size: 1.5rem;
                letter-spacing: 2px;
            }

            .scene-title h1 {
                font-size: 1.5rem;
                letter-spacing: 3px;
            }

            .scene-title {
                top: 25px;
            }

            .marker-sign {
                min-width: 110px;
                padding: 8px 12px;
            }

            .marker-sign .sign-icon {
                font-size: 1.1rem;
            }

            .marker-sign .sign-name {
                font-size: 0.75rem;
            }

            .marker-post {
                height: 45px;
            }

            .marker:hover .marker-post {
                height: 55px;
            }

            .marker-sign .sign-preview {
                font-size: 0.65rem;
            }

            .marker-1 { left: 5%; bottom: 22%; }
            .marker-2 { left: 18%; bottom: 28%; }
            .marker-3 { left: 32%; bottom: 34%; }
            .marker-4 { left: 48%; bottom: 40%; }
            .marker-5 { left: 64%; bottom: 46%; }
            .marker-6 { left: 78%; bottom: 52%; }

            .year-label {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .hook-text {
                font-size: 1.2rem;
            }

            .scene-title h1 {
                font-size: 1.2rem;
                letter-spacing: 2px;
            }

            .scene-title p {
                font-size: 0.8rem;
            }

            .marker-sign {
                min-width: 90px;
                padding: 6px 10px;
            }

            .marker-sign .sign-icon {
                font-size: 1rem;
            }

            .marker-sign .sign-name {
                font-size: 0.7rem;
            }

            .marker-post {
                height: 35px;
            }

            .marker:hover .marker-post {
                height: 45px;
            }

            .marker-1 { left: 3%; bottom: 20%; }
            .marker-2 { left: 16%; bottom: 26%; }
            .marker-3 { left: 30%; bottom: 32%; }
            .marker-4 { left: 46%; bottom: 38%; }
            .marker-5 { left: 62%; bottom: 44%; }
            .marker-6 { left: 76%; bottom: 50%; }
        }
    </style>
</head>

<body>
    <!-- 开场黑屏 -->
    <div class="intro-overlay" id="introOverlay">
        <div class="hook-text">如果你能穿越回过去，<br>你最想回到哪一年？</div>
    </div>

    <!-- 主场景 -->
    <div class="main-scene" id="mainScene">
        <!-- 题目 -->
        <div class="scene-title">
            <h1>赓续红色血脉，传承奋斗精神</h1>
            <p>六次穿越，一段不能忘却的记忆</p>
        </div>

        <!-- 道路 -->
        <div class="road-container">
            <div class="road-texture"></div>
            <div class="road"></div>
        </div>

        <!-- 年份 -->
        <div class="year-label year-start">1840</div>
        <div class="year-label year-end">2025</div>

        <!-- 路标 -->
        <div class="marker marker-1" data-url="page/longfight_rouit_mod1/mod1.html">
            <div class="marker-sign">
                <i class="sign-icon fas fa-route"></i>
                <div class="sign-name">重走长征路</div>
                <div class="sign-preview">86000人出发，7000人到达</div>
            </div>
            <div class="marker-post"></div>
            <div class="marker-glow"></div>
        </div>

        <div class="marker marker-2" data-url="page/timeriver_museum_mod3/mod3.html">
            <div class="marker-sign">
                <i class="sign-icon fas fa-landmark"></i>
                <div class="sign-name">时间博物馆</div>
                <div class="sign-preview">10个历史物件，触摸历史的温度</div>
            </div>
            <div class="marker-post"></div>
            <div class="marker-glow"></div>
        </div>

        <div class="marker marker-3" data-url="page/sacrifice_mod4/mod4.html">
            <div class="marker-sign">
                <i class="sign-icon fas fa-hands-praying"></i>
                <div class="sign-name">祭祀大典</div>
                <div class="sign-preview">黑暗中发现12颗星，点亮蜡烛</div>
            </div>
            <div class="marker-post"></div>
            <div class="marker-glow"></div>
        </div>

        <div class="marker marker-4" data-url="page/greatman_mod5/mod5.html">
            <div class="marker-sign">
                <i class="sign-icon fas fa-user-tie"></i>
                <div class="sign-name">新中国之父</div>
                <div class="sign-preview">三次选择，改变一个国家的命运</div>
            </div>
            <div class="marker-post"></div>
            <div class="marker-glow"></div>
        </div>

        <div class="marker marker-5" data-url="page/china_power_mod6/mod6.html">
            <div class="marker-sign">
                <i class="sign-icon fas fa-globe-asia"></i>
                <div class="sign-name">中国力量</div>
                <div class="sign-preview">一条线、一张表、一张图</div>
            </div>
            <div class="marker-post"></div>
            <div class="marker-glow"></div>
        </div>

        <div class="marker marker-6" data-url="page/chess_mod2/mod2.html">
            <div class="marker-sign">
                <i class="sign-icon fas fa-chess-board"></i>
                <div class="sign-name">象棋之战</div>
                <div class="sign-preview">指挥一场战役，感受战争的代价</div>
            </div>
            <div class="marker-post"></div>
            <div class="marker-glow"></div>
        </div>

        <!-- 底部 -->
        <div class="scene-footer">
            <p>赓续红色血脉 · 传承奋斗精神 · 争做时代新人</p>
        </div>
    </div>

    <script src="page/filmstrip.js"></script>
    <script>
        // 开场动画
        const introOverlay = document.getElementById('introOverlay');
        const mainScene = document.getElementById('mainScene');

        // 1s 黑屏 → 显示钩子文字
        setTimeout(() => {
            introOverlay.classList.add('show-text');
        }, 1000);

        // 3s 后淡出（1s黑屏 + 2s文字停留）
        setTimeout(() => {
            introOverlay.classList.add('fade-out');
            mainScene.classList.add('visible');
        }, 3500);

        // 完全移除 overlay
        setTimeout(() => {
            introOverlay.style.display = 'none';
        }, 4700);

        // 路标点击 → 胶片转场
        document.querySelectorAll('.marker').forEach(marker => {
            marker.addEventListener('click', () => {
                const url = marker.dataset.url;
                filmstripTransition(url);
            });
        });
    </script>
</body>

</html>
